<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaBus - Contacto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1e293b; }
    header, footer { background: #17253a; color: #fff; padding: 15px 40px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f58220; }
    .logo { font-size: 22px; font-weight: bold; }
    .logo span { color: #f58220; }
    nav a { color: #cbd5e1; text-decoration: none; margin-left: 20px; }
    nav a.active { color: #fff; font-weight: bold; }
    main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: #fff; padding: 24px; border-radius: 6px; margin-top: 20px; border: 1px solid #e2e8f0; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: Arial, sans-serif; }
    textarea { min-height: 110px; resize: vertical; }
    button { background: #f58220; color: #fff; border: none; padding: 10px 22px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .mensaje-ok { margin-top: 14px; color: #15803d; font-weight: bold; display: none; }
    footer { text-align: center; font-size: 12px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Ruta<span>Bus</span></div>
    <nav>
      <a href="index.html">Rutas</a>
      <a href="horarios.html">Horarios</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
  </header>
  <main>
    <h1>Contáctanos</h1>
    <p>Escríbenos si tienes dudas sobre las rutas.</p>
    <div class="card">
      <form onsubmit="enviarFormulario(event)">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" required>
        </div>
        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" type="email" required>
        </div>
        <div class="field">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" required></textarea>
        </div>
        <button type="submit">Enviar</button>
        <p class="mensaje-ok" id="mensajeOk">Mensaje enviado correctamente.</p>
      </form>
    </div>
  </main>
  <footer>RutaBus · Prototipo del taller de Control de versiones</footer>
  <script>
    function enviarFormulario(e) {
      e.preventDefault();
      document.getElementById("mensajeOk").style.display = "block";
      e.target.reset();
    }
  </script>
</body>
</html>
