<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaBus - Horarios</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1e293b; }
    header, footer { background: #17253a; color: #fff; padding: 15px 40px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f58220; }
    .logo { font-size: 22px; font-weight: bold; }
    .logo span { color: #f58220; }
    nav a { color: #cbd5e1; text-decoration: none; margin-left: 20px; }
    nav a.active { color: #fff; font-weight: bold; }
    main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: #fff; padding: 24px; border-radius: 6px; margin-top: 20px; border: 1px solid #e2e8f0; }
    .controls { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    select { padding: 8px 12px; min-width: 220px; }
    button { background: #f58220; color: #fff; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .resultado { margin-top: 20px; padding: 16px; background: #f8fafc; border-left: 4px solid #f58220; }
    footer { text-align: center; font-size: 12px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Ruta<span>Bus</span></div>
    <nav>
      <a href="index.html">Rutas</a>
      <a href="horarios.html" class="active">Horarios</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>
  <main>
    <h1>Consulta tu horario</h1>
    <p>Elige la ruta y el día que necesitas.</p>
    <div class="card">
      <div class="controls">
        <div>
          <label for="ruta">Ruta</label>
          <select id="ruta">
            <option value="Ruta 1 · Campus - Centro|06:30|07:15">Ruta 1 - Campus a Centro</option>
            <option value="Ruta 2 · Campus - Terminal|07:00|07:50">Ruta 2 - Campus a Terminal</option>
            <option value="Ruta 3 · Campus - Mercado|08:00|08:40">Ruta 3 - Campus a Mercado</option>
          </select>
        </div>
        <div>
          <label for="dia">Día</label>
          <select id="dia">
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
            <option>Sábado</option>
          </select>
        </div>
      </div>
      <button type="button" onclick="mostrarHorario()">Ver horario</button>
      <div class="resultado" id="resultado">
        <strong>Ruta 1 · Campus - Centro</strong><br>
        Sale a las 06:30 y llega a las 07:15.
      </div>
    </div>
  </main>
  <footer>RutaBus · Prototipo del taller de Control de versiones</footer>
  <script>
    function mostrarHorario() {
      const [nombre, sale, llega] = document.getElementById("ruta").value.split("|");
      document.getElementById("resultado").innerHTML =
        `<strong>${nombre}</strong><br>Sale a las ${sale} y llega a las ${llega}.`;
    }
  </script>
</body>
</html>
